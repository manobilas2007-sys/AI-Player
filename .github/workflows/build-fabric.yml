name: Build AI Player Fabric 1.20.1
on:
  workflow_dispatch:
    inputs:
      run_gametests:
        description: Executar testes dentro do Minecraft
        type: boolean
        default: true
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test commands and priority arbitration
        run: |
          mkdir -p build/standalone-tests
          javac -encoding UTF-8 -d build/standalone-tests src/main/java/dev/aiplayer/commands/PortugueseOrderParser.java src/main/java/dev/aiplayer/commands/OrderConversation.java src/main/java/dev/aiplayer/ai/brain/DecisionPolicy.java src/devtests/PortugueseOrderParserTest.java src/devtests/DecisionPolicyTest.java src/devtests/ProjectOrderParserTest.java src/devtests/DialogueOrderTest.java
          java -cp build/standalone-tests PortugueseOrderParserTest
          java -cp build/standalone-tests DecisionPolicyTest
          java -cp build/standalone-tests ProjectOrderParserTest
          java -cp build/standalone-tests DialogueOrderTest
      - name: Build mod and compile all GameTests
        run: bash gradlew clean :embedded-baritone:build build compileTestmodJava remapRuntimeSmokeJar --no-daemon --stacktrace
      - name: Verify embedded library and corresponding sources
        run: python3 tools/check_embedded_baritone.py
      - name: Record corresponding source revision
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, subprocess
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          repo = os.environ['GITHUB_REPOSITORY']
          Path('SOURCE_REVISION.txt').write_text(f'Repository: https://github.com/{repo}\nCommit: {revision}\nSource: https://github.com/{repo}/tree/{revision}\nBaritone upstream: 8c55ad0721d42a01a359834edc16aaa9b5bc587d\n')
          PYCODE
      - name: Test packaged mod on production Fabric 0.20.0
        run: python3 tools/run_packaged_runtime_smoke.py --mod-jar build/libs/ai-player-0.6.3-dev.jar --smoke-jar build/runtime-smoke/ai-player-runtime-smoke.jar --fallingtree-jar libs/FallingTree-1.20.1-4.3.4.jar --loader 0.20.0 --work-dir build/packaged-runtime-0.20.0
      - name: Test packaged mod on production Fabric 0.15.11
        run: python3 tools/run_packaged_runtime_smoke.py --mod-jar build/libs/ai-player-0.6.3-dev.jar --smoke-jar build/runtime-smoke/ai-player-runtime-smoke.jar --fallingtree-jar libs/FallingTree-1.20.1-4.3.4.jar --loader 0.15.11 --work-dir build/packaged-runtime-0.15.11
      - name: Run Minecraft regression suite
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_gametests }}
        run: bash gradlew runGametest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Player-v0.6.3-resource-access-build-and-tests
          path: |
            build/libs/ai-player-*.jar
            embedded-baritone/build/libs/*.jar
            embedded-baritone/build.gradle
            embedded-baritone/upstream/
            build.gradle
            settings.gradle
            LICENSE.md
            SOURCE_REVISION.txt
            third-party/Baritone/
            docs/INTEGRACAO_BARITONE.md
            libs/FallingTree-1.20.1-4.3.4.jar
            run-gametest/reports/
            run-gametest/logs/latest.log
            build/packaged-runtime-*/smoke-*.txt
            build/packaged-runtime-*/server-output.log
          if-no-files-found: warn
