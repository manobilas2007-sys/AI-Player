
name: Compilar AI Player

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar Minecraft Fabric 1.20.1
        run: |
          bash gradlew clean build --no-daemon

      - name: Preparar JAR
        run: |
          mkdir -p dist

          find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          ls -lh dist/
          test -n "$(ls -A dist)"

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.4.1-JAR
          path: dist/*.jar
          if-no-files-found: error
