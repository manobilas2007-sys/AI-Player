
name: Compilar AI Player v0.3.3

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto v0.3.3
        run: |
          mkdir -p fontes
          unzip -q AI_Player_Java_1.20.1_v0.3.3_dev_fontes.zip -d fontes

      - name: Compilar Minecraft Fabric 1.20.1
        working-directory: fontes
        run: bash gradlew clean build --no-daemon

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.3.3-JAR
          path: fontes/build/libs/ai-player-0.3.3-dev.jar
          if-no-files-found: error
