
name: Compilar AI Player v0.3.4

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto v0.3.4
        run: |
          mkdir -p fontes
          unzip -q AI_Player_Java_1.20.1_v0.3.4_dev_fontes.zip -d fontes

      - name: Compilar Minecraft Fabric 1.20.1
        run: |
          set -e
          WRAPPER="$(find fontes -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew nao encontrado."
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          bash gradlew clean build --no-daemon

      - name: Preparar arquivo JAR
        run: |
          mkdir -p dist
          find fontes -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist)"

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.3.4-JAR
          path: dist/*.jar
          if-no-files-found: error
