name: Compilar AI Player

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair fontes
        run: |
          mkdir fontes
          python3 - <<'PY'
          import pathlib
          import zipfile

          arquivos = list(pathlib.Path(".").glob("*.zip"))
          if len(arquivos) != 1:
              raise SystemExit("Deixe apenas o ZIP do projeto na raiz.")
          with zipfile.ZipFile(arquivos[0]) as arquivo:
              arquivo.extractall("fontes")
          PY

      - name: Compilar mod
        working-directory: fontes/AI_Player_Java_1.20.1
        run: bash gradlew build --no-daemon

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-JAR
          path: fontes/AI_Player_Java_1.20.1/build/libs/ai-player-0.2.0-dev.jar
          if-no-files-found: error
