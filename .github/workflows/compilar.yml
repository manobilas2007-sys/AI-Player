
name: Compilar AI Player v0.3.7

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto v0.3.7
        run: |
          mkdir -p fontes
          unzip -q AI_Player_Java_1.20.1_v0.3.7_dev_fontes.zip -d fontes

      - name: Localizar projeto Gradle
        run: |
          WRAPPER="$(find fontes -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew nao encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Compilar Minecraft Fabric 1.20.1
        run: |
          cd "$PROJECT_DIR"
          bash gradlew clean build --no-daemon

      - name: Preparar JAR
        run: |
          mkdir -p dist
          find "$PROJECT_DIR/build/libs" -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist)"

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.3.7-JAR
          path: dist/*.jar
          if-no-files-found: error
