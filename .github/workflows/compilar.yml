
name: Compilar AI Player

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar Minecraft Fabric 1.20.1
        run: |
          bash gradlew clean :embedded-baritone:build build --no-daemon

      - name: Verificar biblioteca incorporada
        run: python3 tools/check_embedded_baritone.py

      - name: Record corresponding source revision
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, subprocess
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          repo = os.environ['GITHUB_REPOSITORY']
          Path('SOURCE_REVISION.txt').write_text(f'Repository: https://github.com/{repo}\nCommit: {revision}\nSource: https://github.com/{repo}/tree/{revision}\nBaritone upstream: 8c55ad0721d42a01a359834edc16aaa9b5bc587d\n')
          PYCODE
      - name: Preparar JAR
        run: |
          mkdir -p dist

          find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          ls -lh dist/
          test -n "$(ls -A dist)"

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.6.1-project-bootstrap-JAR-and-sources
          path: |
            dist/*.jar
            build/libs/*-sources.jar
            embedded-baritone/build/libs/*.jar
            embedded-baritone/build.gradle
            build.gradle
            settings.gradle
            LICENSE.md
            SOURCE_REVISION.txt
            third-party/Baritone/
            docs/INTEGRACAO_BARITONE.md
          if-no-files-found: error
