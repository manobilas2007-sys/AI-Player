
name: Compilar AI Player v0.3.4

on: [push, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir -p fontes
          unzip -q AI_Player_Java_1.20.1_v0.3.4_dev_fontes.zip -d fontes

      - name: Corrigir erro no TemporaryPillar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fontes/src/main/java/dev/aiplayer/ai/TemporaryPillar.java")
          s = p.read_text()

          antigo = "if (!npc.isOnGround()) return deferCleanup(mining);"
          novo = "if (!npc.isOnGround()) return false;"

          assert s.count(antigo) == 2, "Codigo diferente do esperado"
          p.write_text(s.replace(antigo, novo, 1))
          print("Erro do TemporaryPillar corrigido!")
          PY

      - name: Compilar Minecraft Fabric 1.20.1
        working-directory: fontes
        run: bash gradlew clean build --no-daemon

      
      - name: Preparar JAR
        run: |
          mkdir -p dist
          find fontes/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist)"


      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AI-Player-v0.3.4-JAR
          path: dist/*.jar
          if-no-files-found: error
